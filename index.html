<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Guardia Médica | Recepción y Lista de Espera en Tiempo Real</title>
    <meta name="description" content="Plataforma de gestión de guardia médica para la admisión rápida de pacientes y el control en tiempo real de las salas de espera en emergencias.">
    <meta name="keywords" content="guardia medica, recepcion de pacientes, emergencias, sala de espera, salud, gestión hospitalaria">
    <meta name="author" content="María José Thompson">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://github.com/mariajosethompson0-eng/guardia-médica">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Sistema de Guardia Médica - Gestión de Emergencias">
    <meta property="og:description" content="Digitalización de la recepción de pacientes y monitoreo en tiempo real de la sala de espera médica.">
    <meta property="og:url" content="https://github.com/mariajosethompson0-eng/guardia-médica">
    <meta property="og:site_name" content="Sistema de Guardia Médica">
    <meta property="og:locale" content="es_ES">
    <meta name="theme-color" content="#0d6efd">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!--
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f6f9;
    }
    header {
        background-color: #0d6efd;
        color: white;
        padding: 1rem;
    }
    form {
        background: white;
        padding: 20px;
        border-radius: 8px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    -->
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">Gestión de Guardia Médica</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="#recepcion">Recepción de Pacientes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#espera">Salas de Espera</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1">
        <div class="row g-4">
            
            <section id="recepcion" class="col-12 col-lg-5">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white border-0 pt-4 px-4">
                        <h2 class="h4 card-title text-primary fw-bold mb-0">Ingreso de Paciente</h2>
                    </div>
                    <div class="card-body p-4">
                        <form>
                            <div class="mb-3">
                                <label for="dni" class="form-label fw-semibold">DNI / Documento:</label>
                                <input type="text" class="form-control" id="dni" name="dni" placeholder="Ingrese número de documento" required>
                            </div>

                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre Completo:</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingrese nombre y apellido" required>
                            </div>

                            <div class="mb-3">
                                <label for="motivo" class="form-label fw-semibold">Motivo de Consulta:</label>
                                <textarea class="form-control" id="motivo" name="motivo" rows="3" placeholder="Describa el motivo..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Registrar Ingreso</button>
                        </form>
                    </div>
                </div>
            </section>

            <section id="espera" class="col-12 col-lg-7">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white border-0 pt-4 px-4">
                        <h2 class="h4 card-title text-primary fw-bold mb-0">Pacientes en Espera</h2>
                    </div>
                    <div class="card-body p-4">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col">Hora</th>
                                        <th scope="col">Paciente</th>
                                        <th scope="col">Motivo</th>
                                        <th scope="col">Estado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="fw-bold text-secondary">10:15</td>
                                        <td>Consulta General</td>
                                        <td>Dolor de cabeza</td>
                                        <td><span class="badge bg-warning text-dark">En espera</span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <footer class="bg-dark text-white py-3 mt-auto">
        <div class="container text-center">
            <p class="mb-0 text-muted">&copy; 2026 Sistema Hospitalario - Guardia Médica</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
